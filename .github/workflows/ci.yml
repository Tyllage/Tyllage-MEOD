name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  client:
    name: Lint & build client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: client-dist
          path: client/dist
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: client
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t tyllage-meod:ci .

      - name: Smoke test (root + SPA fallback)
        run: |
          docker run -d --name web -e PORT=8080 -p 8080:8080 tyllage-meod:ci
          for i in $(seq 1 10); do curl -fs http://localhost:8080/ >/dev/null && break; sleep 1; done
          curl -fsS -o /dev/null -w "/ -> %{http_code}\n" http://localhost:8080/
          curl -fsS -o /dev/null -w "/about -> %{http_code}\n" http://localhost:8080/about
          curl -fsS http://localhost:8080/about | grep -q '<div id="root">'

      - name: Container logs
        if: always()
        run: docker logs web || true
